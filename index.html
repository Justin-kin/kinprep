<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Préparation physique individualisée de l'équipe nationale de kin-ball, saison 2026-2027.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="manifest" href="manifest.webmanifest?v=202611102015"><link rel="icon" type="image/png" href="icons/icon-192.png?v=202611102015"><link rel="apple-touch-icon" href="icons/icon-192.png?v=202611102015">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Mise en page : application mobile en une colonne (max 560 px), en-tête de semaine collant, barre d'onglets en bas, séances en panneaux plein écran. */
:root {
  --bg: #F1F1EF; --surface: #FFFFFF; --surface-2: #F5F5F3; --ink: #141414; --muted: #5E5E5A; --line: #DEDDD8; --line-strong: #BDBCB5;
  --accent: #C8102E; --accent-soft: #FBE3E6; --accent-ink: #FFFFFF;
  --be-black: #141414; --be-yellow: #FDDA24; --be-red: #C8102E;
  --cardio: #7A5C00; --cardio-soft: #FFF3BF; --ok: #1C7C4F; --ok-soft: #DDF1E6; --warn: #A86400; --warn-soft: #FBEFD9; --crit: #B42318; --crit-soft: #FBE2DF;
  --fig-far: #A8A7A0; --ball: #F2C200; --swiss: #FBE9A6;
  --ph-ppg: #1C1C1C; --ph-force: #C8102E; --ph-puiss: #FDDA24; --ph-pic: #8E0B1F; --ph-trans: #6B6B66; --ph-spec: #E2B100; --ph-aff: #8E0B1F;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px; --r-sm: 9px; --phmix: 100%;
  --shadow: 0 1px 2px rgba(20, 22, 30, .06), 0 4px 14px rgba(20, 22, 30, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #1A1A19; --surface-2: #222220; --ink: #F0EFEA; --muted: #A3A29B; --line: #2D2D2A; --line-strong: #43423E;
  --accent: #FF4D5E; --accent-soft: #3B1418; --accent-ink: #1A0507;
  --be-black: #000000; --be-yellow: #FDDA24; --be-red: #E8213A;
  --cardio: #FDDA24; --cardio-soft: #3A3210; --ok: #4CC28A; --ok-soft: #12291F; --warn: #F0B04A; --warn-soft: #2E2312; --crit: #FF7A6E; --crit-soft: #351815;
  --fig-far: #66655F; --ball: #D9AE00; --swiss: #4A4220;
  --ph-ppg: #2E2E2C; --ph-force: #B3122B; --ph-puiss: #E8C11A; --ph-pic: #7E0C1D; --ph-trans: #55554F; --ph-spec: #C99A00; --ph-aff: #7E0C1D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --phmix: 100%; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #1A1A19; --surface-2: #222220; --ink: #F0EFEA; --muted: #A3A29B; --line: #2D2D2A; --line-strong: #43423E;
  --accent: #FF4D5E; --accent-soft: #3B1418; --accent-ink: #1A0507;
  --be-black: #000000; --be-yellow: #FDDA24; --be-red: #E8213A;
  --cardio: #FDDA24; --cardio-soft: #3A3210; --ok: #4CC28A; --ok-soft: #12291F; --warn: #F0B04A; --warn-soft: #2E2312; --crit: #FF7A6E; --crit-soft: #351815;
  --fig-far: #66655F; --ball: #D9AE00; --swiss: #4A4220;
  --ph-ppg: #2E2E2C; --ph-force: #B3122B; --ph-puiss: #E8C11A; --ph-pic: #7E0C1D; --ph-trans: #55554F; --ph-spec: #C99A00; --ph-aff: #7E0C1D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --phmix: 100%; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; border: 1px solid var(--line); }

/* en-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 8px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; }
.brand b { color: var(--accent); }
.flag { display: inline-flex; width: 18px; height: 13px; border-radius: 2px; overflow: hidden; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 0 1px var(--line); }
.flag i { flex: 1; } .flag i:nth-child(1) { background: var(--be-black); } .flag i:nth-child(2) { background: var(--be-yellow); } .flag i:nth-child(3) { background: var(--be-red); }
.brand { display: inline-flex; align-items: center; }
.brand .ring { width: 28px; height: 28px; margin-right: 7px; padding: 2px; background: #fff; border-radius: 50%; }
.wclogo { background: #fff; border-radius: var(--r); padding: 14px; display: grid; place-items: center; }
.wclogo img { width: min(240px, 70%); height: auto; display: block; }
.wknav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.wk-label { text-align: center; min-width: 116px; }
.wk-label .w { font: 700 18px/1 var(--display); }
.wk-label .d { font-size: 12px; color: var(--muted); }

/* bannière de phase */
.phase { border-radius: var(--r); padding: 22px 16px 18px; color: var(--phfg, #fff); background: var(--phc); background: color-mix(in srgb, var(--phc) var(--phmix), #000); position: relative; overflow: hidden; }
.phase::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--be-black) 0 33.3%, var(--be-yellow) 33.3% 66.6%, var(--be-red) 66.6%); }
.phase::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 22px solid color-mix(in srgb, var(--phfg, #fff) 13%, transparent); }
.phase h2 { font-size: 30px; text-transform: uppercase; }
.phase .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 6px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.phase .pill { background: color-mix(in srgb, var(--phfg, #fff) 16%, transparent); color: var(--phfg, #fff); }
.phase p { margin: 10px 0 0; max-width: 46ch; font-size: 14px; opacity: .92; }
.phase .bar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--phfg, #fff) 25%, transparent); margin-top: 14px; overflow: hidden; }
.phase .bar i { display: block; height: 100%; background: var(--phfg, #fff); border-radius: 3px; }

/* bande des jours */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { background: var(--surface); border-radius: 10px; padding: 7px 2px 8px; text-align: center; min-height: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid transparent; }
.day.today { border-color: var(--accent); }
.day .dn { font: 600 11px/1 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.day .dd { font: 700 17px/1 var(--display); }
.tag { font: 700 10px/1 var(--body); padding: 3px 5px; border-radius: 5px; letter-spacing: .02em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag.ev { background: var(--warn-soft); color: var(--warn); }
.tag.ev.COMP, .tag.ev.PO { background: var(--crit-soft); color: var(--crit); }
.tag.club { background: var(--surface-2); color: var(--muted); }
.tag.s-renfo { background: var(--accent-soft); color: var(--accent); }
.tag.s-cardio { background: var(--cardio-soft); color: var(--cardio); }
.tag.done { background: var(--ok-soft); color: var(--ok); }

/* charge de la semaine */
.mode { display: flex; align-items: center; gap: 12px; }
.gauge { width: 52px; height: 52px; flex: none; }
.mode-normal { --mc: var(--ok); } .mode-allege { --mc: var(--warn); } .mode-minimal { --mc: var(--crit); } .mode-repos { --mc: var(--muted); }
.mode .lbl { font: 700 20px/1 var(--display); color: var(--mc); }

/* cartes de séance */
.sess { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px 10px 10px; box-shadow: var(--shadow); border: 0; text-align: left; width: 100%; }
.sess .thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.sess .thumb .fig { width: 64px; height: 56px; }
.sess .ttl { font: 700 18px/1.1 var(--display); }
.sess .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.sess .k { font: 700 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; }
.sess.renfo .k { color: var(--accent); } .sess.cardio .k { color: var(--cardio); } .sess.test .k, .sess.mobilite .k { color: var(--ph-spec); }
.sess.done { opacity: .78; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check svg { width: 16px; height: 16px; }
.badge { font: 600 11px/1 var(--body); padding: 4px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.ess { background: var(--ink); color: var(--surface); }
.badge.cons { background: var(--accent-soft); color: var(--accent); }

/* boutons */
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font: 700 16px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.sm svg { width: 17px; height: 17px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); }
.btn.block { width: 100%; }
.btn.sm { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* formulaires */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], select, textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 16px; color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
.ck { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ck:last-child { border-bottom: 0; }
.ck input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.ck .grow { font-size: 15px; }
.ck input[type=number] { width: 84px; padding: 7px 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 11px; overflow: hidden; background: var(--surface); }
.stepper button { width: 42px; height: 42px; border: 0; background: var(--surface-2); font-size: 20px; font-weight: 700; }
.stepper input { width: 64px; border: 0; text-align: center; font: 700 20px/1 var(--display); padding: 0; background: transparent; }

/* panneaux */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 16, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 20px 20px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .22s ease; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 4px auto 12px; }
.page { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow: auto; animation: up .2s ease; }
.page-in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 8px) calc(110px + env(safe-area-inset-bottom, 0px)); }
.page-top { display: flex; align-items: center; gap: 10px; padding-block: 6px 10px; position: sticky; top: 0; background: var(--bg); z-index: 3; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cta > div { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* exercices */
.blk { display: flex; flex-direction: column; gap: 8px; }
.blk-h { display: flex; align-items: baseline; gap: 8px; }
.blk-h .g { font: 700 22px/1 var(--display); color: var(--accent); }
.ex { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 8px 10px 8px 8px; box-shadow: var(--shadow); width: 100%; border: 0; text-align: left; }
.ex .thumb { width: 76px; height: 70px; border-radius: 10px; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.ex .thumb .fig { width: 76px; height: 66px; }
.ex .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
.ex .rx { font: 600 15px/1.2 var(--display); letter-spacing: .02em; margin-top: 3px; }
.ex .rx b { color: var(--accent); font-weight: 700; }
.ex .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.more { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.more svg { width: 18px; height: 18px; }
.wu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.wu .it { flex: none; width: 104px; background: var(--surface); border-radius: 12px; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; border: 0; }
.wu .it .fig { width: 92px; height: 80px; }

/* figure */
.fig { display: block; }
.fig .lim { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .lim.n, .fig .trk { stroke: var(--ink); stroke-linecap: round; fill: none; }
.fig .lim.f { stroke: var(--fig-far); }
.fig .hd { fill: var(--ink); }
.fig .eq { fill: var(--accent); stroke: var(--accent); }
.fig .eqi { fill: var(--surface); stroke: none; }
.fig .band { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
.fig .rope { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.fig .furn { fill: var(--line-strong); stroke: var(--line-strong); }
.fig .wall { stroke: var(--line-strong); }
.fig .ball { fill: var(--ball); }
.fig .swiss { fill: var(--swiss); }
.fig .gnd { stroke: var(--line-strong); stroke-width: 1.2; }
.fig .mat { fill: var(--line); }
.fig .cone { fill: var(--warn); }
.fig .arr { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }

/* lecteur de séance */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
.player-in { max-width: 560px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; min-height: 0; }
.prog { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.stage { background: var(--surface); border-radius: 18px; flex: 0 0 auto; height: min(34vh, 300px); min-height: 170px; display: grid; place-items: center; position: relative; overflow: hidden; }
.stage > [data-anim] { position: absolute; inset: 8px; }
.stage .fig { width: 100%; height: 100%; }
.big { font: 700 54px/1 var(--display); letter-spacing: .01em; }
.big small { font-size: 22px; color: var(--muted); font-weight: 600; }
.rpe { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.rpe button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 0; font: 700 17px/1 var(--display); }
.rpe button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ring { width: 210px; height: 210px; }
.ring circle { fill: none; stroke-width: 12; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring.work .fg { stroke: var(--crit); } .ring.rest .fg { stroke: var(--ok); }
.sig { font: 700 160px/1 var(--display); color: var(--accent); }
.wu .it > [data-anim] { height: 80px; }
.wu .it .fig { width: 100%; height: 80px; }

/* barre d'onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--accent); }

/* plan annuel */
.ph-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--surface); border: 0; width: 100%; text-align: left; }
.ph-row.cur { outline: 2px solid var(--accent); }
.ph-row .w { font: 700 18px/1 var(--display); }
.dots { display: flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--ok); }
.ph-head { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.ph-head .sw { width: 12px; height: 12px; border-radius: 3px; background: var(--phc); }
